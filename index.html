<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حساب المتجر</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    color:#1d1d1f;
}

.page{
    max-width:520px;
    margin:35px auto;
    padding:18px;
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    font-size:30px;
    margin:5px 0 8px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#6e6e73;
    font-size:16px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:25px;
    padding:28px 24px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.notice{
    background:#f2f2f7;
    border-radius:15px;
    padding:18px;
    margin-bottom:25px;
    line-height:1.8;
}

.notice-title{
    font-weight:700;
    font-size:18px;
    margin-bottom:6px;
}

.group{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:17px;
    font-weight:600;
    margin-bottom:8px;
}

input, textarea{
    width:100%;
    border:1px solid #d2d2d7;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus, textarea:focus{
    border-color:#0071e3;
    box-shadow:0 0 0 3px rgba(0,113,227,.12);
}

.code-row{
    display:flex;
    gap:8px;
}

.code-row input{
    flex:1;
}

.code-btn{
    border:0;
    border-radius:12px;
    background:#0071e3;
    color:white;
    padding:0 16px;
    font-size:15px;
    cursor:pointer;
}

.note{
    background:#fff8e1;
    border:1px solid #f0df9a;
    border-radius:15px;
    padding:17px;
    line-height:1.9;
    font-size:15px;
    color:#444;
}

.demo{
    text-align:center;
    color:#86868b;
    font-size:12px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="page">

    <div class="logo"></div>

    <h1>حساب المتجر</h1>

    <div class="subtitle">
        لتحميل البرامج والألعاب
    </div>

    <div class="card">

        <div class="notice">
            <div class="notice-title">⚠️ تنويه هام</div>
            حساب المتجر مخصص لتحميل البرامج والألعاب.
        </div>

        <div class="group">
            <label>البريد الإلكتروني</label>
            <input type="email" placeholder="أدخل البريد الإلكتروني">
        </div>

        <div class="group">
            <label>كلمة المرور</label>
            <input type="password" placeholder="أدخل كلمة المرور">
        </div>

        <div class="group">
            <label>الرمز</label>

            <div class="code-row">
                <input type="text" placeholder="أدخل الرمز">
                <button class="code-btn" type="button">
                    الحصول على رمز
                </button>
            </div>
        </div>

        <div class="group">
            <label>ملاحظة</label>

            <div class="note">
                يجب ربط الحساب برقم الهاتف الشخصي (العراقي)
                خلال مدة أقصاها عشرة أيام من تاريخ التفعيل.
                <br><br>
                يُرجى الاحتفاظ بمعلومات الحساب في مكان آمن لتجنب فقدان المعلومات.
            </div>
        </div>

    </div>

    <div class="demo">
        واجهة تجريبية للتصميم فقط
    </div>

</div>

</body>
</html>
