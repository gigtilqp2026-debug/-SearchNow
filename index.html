<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر سرچنال</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,#f5f5f7,#ffffff);
  color:#1d1d1f;
}

.container{
  max-width:620px;
  margin:45px auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:18px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:700;
  box-shadow:0 8px 25px #0002;
}

h1{
  margin:18px 0 8px;
  font-size:30px;
}

.subtitle{
  color:#6e6e73;
  font-size:18px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px;
  box-shadow:0 10px 35px #00000012;
  border:1px solid #eee;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:700;
  margin-bottom:25px;
}

label{
  display:block;
  margin:18px 4px 8px;
  font-weight:600;
}

.input{
  width:100%;
  padding:15px;
  border:1px solid #d2d2d7;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fafafa;
}

.input:focus{
  border-color:#777;
  background:white;
}

.code-row{
  display:flex;
  gap:8px;
}

.code-row .input{
  flex:1;
}

.demo-button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#111;
  color:white;
  font-size:15px;
}

.notice{
  margin-top:25px;
  padding:18px;
  background:#f5f5f7;
  border-radius:16px;
  line-height:1.8;
  color:#555;
  font-size:14px;
}

.date{
  margin-top:20px;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#888;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo"></div>

    <h1>المتجر سرچنال</h1>

    <div class="subtitle">
      حسابات متجر التطبيقات
    </div>

  </div>

  <div class="card">

    <div class="title">
      معلومات الحساب
    </div>

    <label>البريد الإلكتروني</label>
    <input class="input"
           type="text"
           placeholder="أدخل البريد الإلكتروني">

    <label>كلمة المرور</label>
    <input class="input"
           type="password"
           placeholder="أدخل كلمة المرور">

    <label>الحصول على رمز</label>

    <div class="code-row">
      <input class="input"
             type="text"
             placeholder="رمز التحقق"
             inputmode="numeric">

      <button class="demo-button"
              type="button">
        الحصول على رمز
      </button>
    </div>

    <div class="notice">
      <strong>ملاحظة</strong><br>
      يجب ربط الحساب برقم الهاتف الشخصي (العراقي)
      خلال مدة أقصاها عشرة أيام من تاريخ التفعيل.
      <br><br>
      يُرجى الاحتفاظ بمعلومات الحساب بشكل آمن
      لتجنب فقدان المعلومات.
    </div>

    <div class="date">
      <label>تاريخ التفعيل</label>
      <input class="input"
             type="date">
    </div>

  </div>

  <div class="footer">
    © المتجر سرچنال
  </div>

</div>

</body>
</html>
